name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Android packaging project
        uses: actions/checkout@v4
      - name: Fetch pinned upstream (do not update without review)
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/bad-woman/vertex2openai.git /tmp/vertex2openai
          git -C /tmp/vertex2openai checkout --detach 53a45b63bfef39e783edf8ea9c1e06800fc17496
          mkdir -p app/src/main/python app/src/main/assets
          cp -a /tmp/vertex2openai/app/. app/src/main/python/
          cp /tmp/vertex2openai/vertexModels.json app/src/main/assets/vertexModels.json
          cp /tmp/vertex2openai/LICENSE app/src/main/assets/vertex2openai-LICENSE.txt
          python3 -m compileall -q app/src/main/python
          if grep -R -n -E '(^|[[:space:]])(from|import)[[:space:]]+curl_cffi' app/src/main/python; then
            echo 'ERROR: New upstream requires curl_cffi; assess Android wheel first.'; exit 1
          fi
      - name: Install host Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build unsigned debug APK (signed by Android debug key)
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vertex2OpenAI-Android-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
